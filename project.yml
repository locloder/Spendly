name: Spendly
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Spendly:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Spendly
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSpeechRecognitionUsageDescription: Для голосового ввода трат
        NSMicrophoneUsageDescription: Для голосового ввода трат
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makfinance.spendly
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
